<div class="min-h-screen bg-gradient-to-br from-slate-900 via-blue-950 to-slate-900 flex items-center justify-center p-6">
  <div class="w-full max-w-md">

    <div class="bg-slate-800/60 border border-slate-700/50 rounded-2xl p-8 shadow-2xl text-center">

      <div class="text-5xl mb-4">👤</div>
      <h1 class="text-2xl font-bold text-white mb-1">Bienvenido</h1>
      <p class="text-blue-400 font-medium mb-6">{{ nombreUsuario }}</p>

      <div class="bg-slate-900/50 rounded-xl px-4 py-3 mb-6">
        <p class="text-slate-400 text-sm">Sesión activa — token guardado en
          <span class="text-blue-300">localStorage</span>
        </p>
      </div>

      <button (click)="cerrarSesion()"
        class="w-full border border-slate-600 hover:border-red-500 text-slate-300
               hover:text-red-400 font-medium py-3 rounded-xl transition-colors duration-200">
        Cerrar sesión
      </button>

    </div>
  </div>
</div>
