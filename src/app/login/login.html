<div class="min-h-screen bg-gradient-to-br from-slate-900 via-blue-950 to-slate-900 flex items-center justify-center p-4">
  <div class="w-full max-w-md">

    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 bg-blue-500 rounded-2xl mb-4 shadow-lg shadow-blue-500/30">
        <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
        </svg>
      </div>
      <h1 class="text-3xl font-bold text-white tracking-tight">Iniciar sesión</h1>
      <p class="text-slate-400 mt-1 text-sm">Ingresa tus credenciales para continuar</p>
    </div>

    <div class="bg-slate-800/60 backdrop-blur-sm border border-slate-700/50 rounded-2xl p-8 shadow-2xl">

      <div *ngIf="mensajeError"
        class="flex items-center gap-2 bg-red-500/10 border border-red-500/30 text-red-400 text-sm rounded-xl px-4 py-3 mb-6">
        <svg class="w-4 h-4 shrink-0" fill="currentColor" viewBox="0 0 20 20">
          <path fill-rule="evenodd"
            d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z"
            clip-rule="evenodd"/>
        </svg>
        {{ mensajeError }}
      </div>

      <div class="mb-5">
        <label class="block text-sm font-medium text-slate-300 mb-2">Correo electrónico</label>
        <input type="email" placeholder="tu@correo.com" [(ngModel)]="usuario.email" name="email"
          class="w-full bg-slate-900/70 border border-slate-600 text-white placeholder-slate-500
                 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-blue-500
                 focus:ring-1 focus:ring-blue-500 transition-colors duration-200"/>
      </div>

      <div class="mb-7">
        <label class="block text-sm font-medium text-slate-300 mb-2">Contraseña</label>
        <input type="password" placeholder="Tu contraseña" [(ngModel)]="usuario.password" name="password"
          class="w-full bg-slate-900/70 border border-slate-600 text-white placeholder-slate-500
                 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-blue-500
                 focus:ring-1 focus:ring-blue-500 transition-colors duration-200"/>
      </div>

      <button (click)="login()"
        class="w-full bg-blue-600 hover:bg-blue-500 active:bg-blue-700 text-white font-semibold
               py-3 rounded-xl transition-colors duration-200 shadow-lg shadow-blue-600/30 mb-4">
        Iniciar sesión
      </button>

      <div class="flex items-center gap-3 my-4">
        <div class="flex-1 h-px bg-slate-700"></div>
        <span class="text-slate-500 text-xs">¿No tienes cuenta?</span>
        <div class="flex-1 h-px bg-slate-700"></div>
      </div>

      <button (click)="registro()"
        class="w-full bg-transparent border border-slate-600 hover:border-slate-400 text-slate-300
               hover:text-white font-medium py-3 rounded-xl transition-colors duration-200">
        Crear cuenta
      </button>

    </div>
  </div>
</div>
